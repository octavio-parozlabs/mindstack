# Límites y modelos de mindstack. Valores por defecto del plugin.
# Para cambiarlos en un proyecto: .claude/mindstack.conf con solo las líneas que cambian (mismo formato).
# Los ve el orquestador al arrancar (scripts/config.sh) y los hooks que los usan.

# Rondas revisar ↔ approver ↔ corregir. Qué pasa en la última: agents/approver.md.
# Desde la ronda 2 se revisa solo lo que cambió: una ronda extra es chica.
rondas_revision=8

# Rondas de CI rojo del cambio (developer ci → qa → push). Después: blocked/.
rondas_ci=5

# Fallos seguidos de la misma tarea del TODO en implement. Después: blocked/.
fallos_por_tarea=4

# Hook de parada: intentos seguidos de cortar el turno sin avance (mismo HEAD, git status y motivo).
# Un CI lento cuenta: cada 'gh pr checks --watch' corta a los 10 min, así que 8 rebotes ≈ 80 min de CI pendiente.
rebotes_exige_blocked=8
rebotes_deja_parar=15

# Modelo por agente: sonnet | opus | haiku. Es la única fuente: los agents/*.md no tienen model:.
# Cualquier comando que lance un Agent (/draft, /plan, /orchestrate, /rebase) le pasa este model. maxTurns no se cambia desde acá.
# Criterio: opus donde un error se arrastra (SPEC, código) o se escapa (lo que nadie más ve), y donde se decide;
# sonnet en lo mecánico o lo que otro filtra después. El SPEC lo escribe la sesión principal: usa tu /model.
modelo_analyst=opus         # decide solo: evidencia de historial, código y principios
modelo_designer=opus        # entra al SPEC
modelo_researcher=sonnet    # junta datos y compara
modelo_developer=opus       # lo que se mergea
modelo_qa=sonnet            # caja negra contra el SPEC: volumen
modelo_code-reviewer=sonnet # otro modelo que el developer; el ruido lo filtra el approver
modelo_security-auditor=opus # lo que no ve llega al PR: el approver no rescata un falso negativo
modelo_verifier=sonnet      # mecánico: código, test, correrlo
modelo_approver=opus        # criterio puro, una vez por ronda
modelo_conflict-resolver=opus # poco frecuente, rompe dos intenciones

# Esfuerzo por agente: low | medium | high | xhigh | max. Vacío = el default del modelo.
# Quien lanza el Agent le pasa este effort junto con el model. Más esfuerzo = razona más: más lento y más caro;
# no mejora lo mecánico. El esfuerzo del SPEC es el de tu sesión.
esfuerzo_analyst=high
esfuerzo_designer=high
esfuerzo_researcher=medium
esfuerzo_developer=high
esfuerzo_qa=medium
esfuerzo_code-reviewer=medium
esfuerzo_security-auditor=high
esfuerzo_verifier=low
esfuerzo_approver=xhigh
esfuerzo_conflict-resolver=high

# Turnos máximos por invocación (maxTurns): cuántos pasos con herramientas tiene un agente antes de cortar.
# Al cortar devuelve lo que tiene; en implement cuenta como un fallo (fallos_por_tarea).
# Excepción: Claude Code no deja pasarlo al lanzar el Agent, así que vive en el frontmatter de agents/*.md.
# Este archivo es la fuente: después de cambiarlo, scripts/sync-agents.sh lo copia (hooks/test.sh falla si difieren).
# Por eso no se pisa por proyecto: es del plugin.
turnos_analyst=30
turnos_designer=40
turnos_researcher=30
turnos_developer=100
turnos_qa=60
turnos_code-reviewer=30
turnos_security-auditor=30
turnos_verifier=40
turnos_approver=30
turnos_conflict-resolver=50

# Hallazgos por revisor en cada REVIEW-*.md; el resto va a "A verificar". Se pasa en el prompt de cada revisor.
hallazgos_por_revisor=15

# Propuestas nuevas por tarea que pasan al backlog (los "Visto también" no cuentan).
propuestas_por_tarea=3

# Camino quick (analyze.md › Camino): diff estimado en líneas por debajo del cual una tarea sin áreas de riesgo va por el
# camino liviano. retoque: por debajo de esto, una iteración sobre un PR sin cambio de comportamiento sale en un solo /draft.
quick_max_lineas=50
retoque_max_lineas=20
